<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="ATLAS Investment Operating System 3.0">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
:root{
 --bg:#090b10;--side:#07090d;--panel:#131821;--panel2:#1a202b;--text:#f5f7fa;
 --muted:#9aa6b6;--line:#29313e;--accent:#f4f6f8;--good:#62ca7b;--warn:#e9bd5a;
 --bad:#e37474;--blue:#7cb7ff;--radius:16px
}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}.small{font-size:12px}.muted{color:var(--muted)}
.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 24px}.brand-mark{font-size:28px}.brand strong{font-size:19px;display:block}.brand span{font-size:10px;color:var(--muted)}
nav{display:grid;gap:4px}nav button{background:transparent;color:var(--muted);border:0;text-align:left;padding:11px 12px;border-radius:11px;cursor:pointer}
nav button:hover,nav button.active{background:var(--panel);color:var(--text)}.side-bottom{margin-top:auto;display:grid;gap:9px;padding:8px}
.main{padding:42px 36px;max-width:1320px;width:100%;margin:auto}.mobile-header{display:none}
h1{font-size:36px;letter-spacing:-1px;margin:0 0 7px}h2{font-size:22px;margin:34px 0 15px}h3{margin:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:26px;font-weight:750;margin:7px 0}.metric .foot{font-size:11px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:11px;cursor:pointer}.btn.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:750}.btn.ghost{background:transparent}.btn.danger{color:#ffd9d9}.btn.full{width:100%}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:17px 0}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.form label{font-size:12px;color:var(--muted)}.form input,.form select,.form textarea{display:block;width:100%;margin-top:5px;background:#0d1118;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:9px}.form textarea{min-height:90px}.form .full{grid-column:1/-1}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:15px}.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;color:var(--muted);padding:22px}
.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.hero-main{background:linear-gradient(145deg,#171d27,#0f131a);border:1px solid var(--line);border-radius:22px;padding:26px}.hero-main h1{font-size:42px}.hero-main .headline{font-size:23px;font-weight:750;margin:18px 0 8px}.hero-side{display:grid;gap:12px}.status{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;justify-content:space-between;gap:12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick button{text-align:left;min-height:85px}
.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.asset{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.asset-top{display:flex;justify-content:space-between;gap:12px}.asset-name{font-size:20px;font-weight:760}.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats4 b{display:block;margin-top:4px}.progress{height:8px;background:#0d1016;border-radius:99px;overflow:hidden;margin:13px 0}.progress span{display:block;height:100%;background:var(--accent)}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:320px}.chart-card canvas{max-height:270px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;color:var(--muted)}tr:last-child td{border-bottom:0}
.news-list,.timeline,.calendar-list{display:grid;gap:11px}.news,.entry,.calendar-event{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}.news-top,.entry-top{display:flex;justify-content:space-between;gap:12px}.news h3{font-size:16px;margin:8px 0}.news a{color:var(--text);text-decoration:none}.news a:hover{text-decoration:underline}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;white-space:nowrap}.badge.low{color:var(--good)}.badge.medium{color:var(--warn)}.badge.high{color:var(--bad)}
.calendar-event{display:grid;grid-template-columns:130px 1fr auto;gap:14px;align-items:center}.search{width:100%;background:#0d1118;color:var(--text);border:1px solid var(--line);padding:12px;border-radius:11px}.results{display:grid;gap:8px;margin-top:10px}.result{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.chat{display:grid;grid-template-rows:1fr auto;min-height:65vh}.messages{display:grid;gap:12px;align-content:start}.message{max-width:850px;border-radius:16px;padding:14px 16px;line-height:1.55;white-space:pre-wrap}.message.user{background:var(--panel2);margin-left:auto}.message.ai{background:var(--panel);border:1px solid var(--line)}.composer{display:flex;gap:10px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 25%);padding-top:30px}.composer textarea{flex:1;background:#0d1118;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:12px;min-height:52px;resize:vertical}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px}.auth-card p{color:var(--muted);margin-top:-5px}.stack{display:grid;gap:12px;margin-top:22px}.stack label{font-size:12px;color:var(--muted)}.stack input{display:block;width:100%;margin-top:5px;background:#0d1118;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 15px;z-index:100}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite;margin-right:7px;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}.icon-btn{border:0;background:transparent;color:var(--text);font-size:20px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;width:245px;transition:.2s}.sidebar.open{left:0}.mobile-header{display:flex;position:sticky;top:0;z-index:25;justify-content:space-between;background:rgba(7,9,13,.95);backdrop-filter:blur(12px);padding:13px 16px;border-bottom:1px solid var(--line)}.main{padding:23px 15px 50px}.hero,.chart-grid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}.asset-grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .full{grid-column:1}.calendar-event{grid-template-columns:1fr}}
@media(max-width:520px){.grid,.quick{grid-template-columns:1fr}.hero-main h1{font-size:32px}.stats4{grid-template-columns:repeat(2,1fr)}}

/* ATLAS 3.0 Alpha 2 — premium home */
:root{
  --green-glow:rgba(74,222,128,.18);
  --blue-glow:rgba(96,165,250,.16);
  --purple-glow:rgba(192,132,252,.15);
}
body{background:
 radial-gradient(circle at 70% -20%,rgba(44,82,130,.12),transparent 32%),
 radial-gradient(circle at 92% 15%,rgba(24,150,92,.06),transparent 24%),
 var(--bg)}
.sidebar{box-shadow:14px 0 40px rgba(0,0,0,.18)}
.brand span{font-size:11px;letter-spacing:.01em}
.main{max-width:1450px}
.home-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,.65fr);gap:18px}
.home-main,.home-rail{display:grid;gap:16px;align-content:start}
.premium-hero{
  position:relative;overflow:hidden;min-height:278px;
  background:linear-gradient(135deg,#141b26 0%,#10161f 55%,#0e171b 100%);
  border:1px solid #2a3443;border-radius:22px;padding:28px;
  box-shadow:0 22px 55px rgba(0,0,0,.2)
}
.premium-hero:before{
  content:"";position:absolute;width:330px;height:330px;border-radius:50%;
  right:-90px;top:-115px;background:radial-gradient(circle,rgba(53,217,132,.18),transparent 68%)
}
.hero-kicker{color:#a9bad0;font-size:14px;margin-bottom:28px}
.greeting-line{display:flex;align-items:center;gap:14px}
.greeting-icon{font-size:44px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28))}
.premium-hero h1{font-size:42px;line-height:1.05;margin:0}
.hero-verdict{font-size:22px;font-weight:800;color:var(--good);margin:24px 0 12px}
.hero-copy{font-size:15px;color:#b0bfd2;max-width:720px;line-height:1.6;margin:0 0 7px}
.hero-art{position:absolute;right:58px;bottom:24px;width:170px;height:150px;opacity:.9}
.hero-art .glow{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle,rgba(44,230,126,.34),transparent 65%)}
.hero-art .beam{position:absolute;width:120px;height:40px;right:-35px;top:42px;background:linear-gradient(90deg,rgba(252,231,116,.46),transparent);clip-path:polygon(0 35%,100% 0,100% 100%,0 65%)}
.hero-art .tower{position:absolute;left:72px;bottom:10px;width:30px;height:100px;background:linear-gradient(#203142,#0b1017);clip-path:polygon(35% 0,65% 0,87% 100%,13% 100%);border:1px solid rgba(131,162,190,.25)}
.hero-art .lamp{position:absolute;left:68px;top:35px;width:38px;height:25px;background:#ffd66e;border:4px solid #15202d;border-radius:4px}
.hero-art .rock{position:absolute;bottom:0;left:20px;width:140px;height:38px;background:#0b1119;clip-path:polygon(0 100%,18% 45%,38% 60%,53% 5%,70% 58%,100% 100%)}
.metric-grid-premium{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric-premium{
  background:linear-gradient(145deg,#161d28,#121822);border:1px solid #293443;border-radius:16px;
  padding:18px;min-height:142px;position:relative;overflow:hidden
}
.metric-premium .metric-icon{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;margin-bottom:13px;background:rgba(80,150,255,.09)}
.metric-premium.green .metric-icon{background:var(--green-glow)}
.metric-premium.purple .metric-icon{background:var(--purple-glow)}
.metric-premium .metric-label{color:#b6c3d4;font-size:14px}
.metric-premium .metric-value{font-size:27px;font-weight:800;margin:6px 0}
.metric-premium .metric-foot{font-size:12px;color:#9ba8b9}
.metric-premium .metric-sub{font-size:12px;color:#93a2b6;border-top:1px solid #25303d;margin-top:13px;padding-top:10px}
.section-title{font-size:22px;font-weight:800;margin:6px 0 4px}
.decision-card{display:flex;align-items:center;gap:16px;background:linear-gradient(145deg,#151c27,#121822);border:1px solid #293443;border-radius:15px;padding:16px 18px}
.decision-check{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#61d887;color:#102016;font-size:24px;font-weight:900;flex:0 0 auto}
.decision-body{flex:1}.decision-body b{display:block;margin-bottom:4px}.decision-action{white-space:nowrap}
.quick-premium{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.quick-premium button{min-height:105px;text-align:left;display:flex;align-items:center;gap:13px}
.quick-premium .quick-icon{width:43px;height:43px;display:grid;place-items:center;border-radius:10px;background:var(--purple-glow);font-size:24px;flex:0 0 auto}
.quick-premium button:nth-child(2) .quick-icon{background:var(--green-glow)}
.quick-premium button:nth-child(3) .quick-icon{background:var(--blue-glow)}
.quick-premium button:nth-child(4) .quick-icon{background:var(--purple-glow)}
.quick-premium b{font-size:15px}.quick-premium span{display:block;margin-top:4px}
.rail-card{background:linear-gradient(145deg,#151c27,#111720);border:1px solid #293443;border-radius:17px;padding:18px}
.rail-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.rail-title h3{font-size:18px}
.radar-alert{padding:14px 0;border-top:1px solid #26313e}.radar-alert:first-of-type{border-top:0;padding-top:2px}
.radar-alert .impact{font-weight:750;font-size:13px}.radar-alert.high .impact{color:#ff7373}.radar-alert.medium .impact{color:#ffc65d}.radar-alert.low .impact{color:var(--good)}
.radar-alert p{margin:7px 0;color:#c1cbd8;font-size:13px;line-height:1.45}
.radar-alert small{color:#8190a3}
.event-card{display:grid;gap:11px}.event-row{display:flex;justify-content:space-between;gap:15px}.event-name{font-size:17px;font-weight:750}
.service-list{display:grid;gap:11px}.service-row{display:flex;justify-content:space-between;gap:15px;font-size:13px}.service-dot{color:var(--good);margin-right:8px}.service-ok{color:var(--good)}
.atlas-footer{
  margin:26px -36px -42px;padding:18px 36px;background:#0e141d;border-top:1px solid #25303d;
  display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr auto;align-items:center;gap:22px
}
.footer-block{padding-right:22px;border-right:1px solid #26313f;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.footer-block:last-child{border-right:0;padding-right:0}
.footer-brand strong{font-size:18px}.footer-brand span,.footer-label{color:#9caabd;font-size:12px;margin-top:4px}
.footer-version{color:var(--good);font-weight:750}.footer-status{color:var(--good);font-size:12px;margin-top:4px}
.footer-update{min-width:180px}
@media(max-width:1150px){
  .home-layout{grid-template-columns:1fr}.home-rail{grid-template-columns:repeat(3,1fr)}
  .atlas-footer{grid-template-columns:repeat(2,1fr);margin-left:-20px;margin-right:-20px}.footer-block{border-right:0}
}
@media(max-width:900px){
  .premium-hero h1{font-size:34px}.hero-art{display:none}.metric-grid-premium,.quick-premium{grid-template-columns:repeat(2,1fr)}
  .home-rail{grid-template-columns:1fr}.atlas-footer{margin:22px -15px -50px;padding:18px 15px;grid-template-columns:1fr}
}
@media(max-width:520px){.metric-grid-premium,.quick-premium{grid-template-columns:1fr}.decision-card{align-items:flex-start}.decision-action{display:none}}


/* ATLAS Intelligence Center — Alpha 6 */
.intelligence-hero{display:grid;grid-template-columns:minmax(260px,.72fr) 1.28fr;gap:22px;background:linear-gradient(145deg,#151d29,#10161f);border:1px solid #2b3748;border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.eyebrow{font-size:12px;letter-spacing:.16em;color:#9bacbf;font-weight:800}.score-line{display:flex;align-items:flex-end;margin-top:8px}.score-number{font-size:72px;line-height:.9;font-weight:850}.score-max{font-size:23px;color:#8290a3;margin:0 0 8px 5px}.score-label{font-size:18px;font-weight:800;margin-top:10px}.score-components{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sm-component{display:flex;justify-content:space-between;align-items:center;background:#0e141d;border:1px solid #273342;border-radius:12px;padding:13px}.intel-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0 24px}.intel-card{background:linear-gradient(145deg,#151c27,#111720);border:1px solid #293443;border-radius:17px;padding:18px}.intel-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.intel-title h2{margin:0;font-size:19px}.smart-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.smart-summary>div{background:#0d131c;border:1px solid #26313e;border-radius:11px;padding:11px}.smart-summary span{display:block;font-size:11px;color:#8f9daf}.smart-summary b{display:block;margin-top:5px}.smart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.signal-card{background:#0e141d;border:1px solid #273342;border-radius:13px;padding:13px}.signal-head{display:flex;justify-content:space-between;gap:10px}.signal-value{font-size:21px;font-weight:800;margin:13px 0 5px}.source-link{display:inline-block;margin-top:10px;color:#b99ae8;font-size:12px}.module-empty{background:#0e141d;border:1px dashed #2c3848;border-radius:13px;padding:16px;color:#aeb9c8}.module-empty p{margin:7px 0 0;line-height:1.5}.disclaimer{font-size:11px;color:#8190a3;margin-top:13px;border-top:1px solid #26313e;padding-top:11px}
@media(max-width:950px){.intelligence-hero,.intel-tabs{grid-template-columns:1fr}.smart-summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.score-components,.smart-grid{grid-template-columns:1fr}.score-number{font-size:58px}}


.tracked-panel{margin:14px 0 18px}.tracked-row{display:flex;gap:10px;margin:12px 0}.tracked-row input{flex:1;min-width:180px}.tracked-groups{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tracked-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.tracked-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:var(--panel2);font-weight:700}.tracked-chip small{font-size:10px;color:var(--muted);font-weight:500}.tracked-chip button{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0}.tracked-chip.auto{border-style:dashed}@media(max-width:760px){.tracked-groups{grid-template-columns:1fr}.tracked-row{flex-direction:column}}

.edit-modal-backdrop{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(3,7,13,.78);backdrop-filter:blur(8px)
}
.edit-modal-backdrop.hidden{display:none}
.edit-modal{
  width:min(720px,100%);max-height:calc(100vh - 48px);overflow:auto;
  background:var(--panel,#151c27);border:1px solid var(--line,#2b3647);
  border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.55)
}
.edit-modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:20px 22px;border-bottom:1px solid var(--line,#2b3647)
}
.edit-modal-head h2{margin:0;font-size:22px}
.edit-modal-close{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line,#2b3647);
  background:transparent;color:var(--text,#fff);font-size:22px;cursor:pointer
}
.edit-modal-body{padding:22px}
.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.edit-grid label{display:flex;flex-direction:column;gap:8px;color:var(--muted,#9eb0c8);font-size:13px}
.edit-grid input,.edit-grid select{
  width:100%;min-height:46px;padding:11px 12px;border-radius:12px;
  border:1px solid var(--line,#2b3647);background:var(--bg,#090d13);
  color:var(--text,#fff);font:inherit
}
.edit-grid input:focus,.edit-grid select:focus{
  outline:none;border-color:#7aa7ff;box-shadow:0 0 0 3px rgba(122,167,255,.14)
}
.edit-modal-actions{
  display:flex;justify-content:flex-end;gap:12px;padding:18px 22px;
  border-top:1px solid var(--line,#2b3647)
}
@media(max-width:640px){
  .edit-modal-backdrop{padding:10px;align-items:flex-end}
  .edit-modal{max-height:92vh;border-radius:18px 18px 0 0}
  .edit-grid{grid-template-columns:1fr}
}


.asset-editor-layout{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(240px,.75fr);
  gap:18px;
  align-items:start
}
.asset-editor-fields{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px
}
.asset-field{
  display:flex;
  flex-direction:column;
  gap:8px;
  color:var(--muted,#9eb0c8);
  font-size:13px
}
.asset-field.full{grid-column:1/-1}
.asset-field-label{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;

function normalizeBenchmarkRows(rows,dateKey,valueKey){
  const clean=(rows||[])
    .map(row=>({date:String(row[dateKey]||'').slice(0,10),raw:Number(row[valueKey]||0)}))
    .filter(row=>row.date&&Number.isFinite(row.raw)&&row.raw>0)
    .sort((a,b)=>a.date.localeCompare(b.date));

  if(!clean.length)return[];
  const first=clean[0].raw;
  return clean.map(row=>({date:row.date,value:(row.raw/first)*100}));
}

function commonBenchmarkData(portfolio,benchmark){
  const portfolioMap=new Map(portfolio.map(x=>[x.date,x.value]));
  const benchmarkMap=new Map(benchmark.map(x=>[x.date,x.value]));
  const dates=[...portfolioMap.keys()].filter(date=>benchmarkMap.has(date)).sort();

  if(!dates.length)return{labels:[],portfolio:[],benchmark:[]};

  const p0=portfolioMap.get(dates[0]);
  const b0=benchmarkMap.get(dates[0]);

  return{
    labels:dates,
    portfolio:dates.map(date=>(portfolioMap.get(date)/p0)*100),
    benchmark:dates.map(date=>(benchmarkMap.get(date)/b0)*100)
  };
}

async function fetchBenchmarkSeries(){
  if(Object.keys(benchmarkSeriesCache).length)return benchmarkSeriesCache;

  const result=await db.functions.invoke('benchmark-data',{
    body:{range:'MAX'}
  });

  if(result.error)throw result.error;
  benchmarkSeriesCache=result.data?.series||{};
  return benchmarkSeriesCache;
}

async function drawManualBenchmark(){
  const canvas=$('benchmark-chart');
  if(!canvas||typeof Chart==='undefined')return;

  const selector=$('benchmark-selector');
  if(selector){
    selector.value=selectedBenchmark;
    selector.onchange=async()=>{
      selectedBenchmark=selector.value;
      localStorage.setItem('atlas-benchmark',selectedBenchmark);
      await drawManualBenchmark();
    };
  }

  const comparison=$('benchmark-comparison-value');
  const label=$('benchmark-comparison-label');
  const meta=BENCHMARK_META[selectedBenchmark]||BENCHMARK_META.sp500;
  if(label)label.textContent=`Diferença face a ${meta.label}`;
  if(comparison){comparison.textContent='A carregar…';comparison.className=''}

  try{
    const series=await fetchBenchmarkSeries();
    const portfolio=normalizeBenchmarkRows(state.snapshots,'snapshot_date','total_value');
    const benchmark=(series[selectedBenchmark]||[])
      .map(x=>({date:String(x.date||'').slice(0,10),value:Number(x.value||0)}))
      .filter(x=>x.date&&x.value>0);

    const aligned=commonBenchmarkData(portfolio,benchmark);

    const previous=charts.find(chart=>chart.canvas===canvas);
    if(previous){
      previous.destroy();
      charts=charts.filter(chart=>chart!==previous);
    }

    if(aligned.labels.length<2){
      charts.push(new Chart(canvas,{
        type:'line',
        data:{labels:[],datasets:[
          {label:'A tua carteira',data:[]},
          {label:meta.label,data:[]}
        ]},
        options:{plugins:{legend:{labels:{color:'#f5f7fa'}}}}
      }));
      if(comparison)comparison.textContent='Ainda sem histórico comum suficiente';
      return;
    }

    charts.push(new Chart(canvas,{
      type:'line',
      data:{
        labels:aligned.labels,
        datasets:[
          {label:'A tua carteira',data:aligned.portfolio,borderWidth:3,pointRadius:0,spanGaps:true},
          {label:meta.label,data:aligned.benchmark,borderWidth:2,pointRadius:0,spanGaps:true}
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:true,
        interaction:{mode:'index',intersect:false},
        plugins:{legend:{labels:{color:'#f5f7fa'}}},
        scales:{
          x:{ticks:{color:'#9aa6b6',maxTicksLimit:7}},
          y:{ticks:{color:'#9aa6b6'},title:{display:true,text:'Base 100',color:'#9aa6b6'}}
        }
      }
    }));

    const portfolioLast=aligned.portfolio.at(-1);
    const benchmarkLast=aligned.benchmark.at(-1);
    const diff=portfolioLast-benchmarkLast;

    if(comparison){
      comparison.textContent=`${diff>=0?'+':''}${diff.toFixed(2)} pontos percentuais`;
      comparison.className=diff>0?'good':diff<0?'bad':'';
    }
  }catch(error){
    console.error('Benchmark:',error);
    if(comparison)comparison.textContent='Benchmark temporariamente indisponível';
  }
}

function inferAssetCategory(ticker,name=''){
  const t=String(ticker||'').toUpperCase();
  const n=String(name||'').toLowerCase();

  if(['SGLN','IGLN','PHAU'].includes(t)||n.includes('gold')||n.includes('ouro')) return 'Ouro';
  if(['SXR8','QDVE','IWDA','EUNL','VUAA','CSPX','VWCE','VWRL'].includes(t)||n.includes('etf')||n.includes('ishares')||n.includes('vanguard')) return 'ETF';
  if(['EUR','USD','CASH'].includes(t)||n.includes('liquidez')||n.includes('cash')) return 'Liquidez';
  return 'Ação';
}


function parseAtlasNumber(value){
  if(typeof value==='number')return Number.isFinite(value)?value:0;
  let text=String(value??'').trim().replace(/\s/g,'');
  if(!text)return 0;

  // Aceita 3.765,98 e 3765.98.
  if(text.includes(',')&&text.includes('.')){
    if(text.lastIndexOf(',')>text.lastIndexOf('.')){
      text=text.replace(/\./g,'').replace(',','.');
    }else{
      text=text.replace(/,/g,'');
    }
  }else if(text.includes(',')){
    text=text.replace(',','.');
  }

  const number=Number(text);
  return Number.isFinite(number)?number:0;
}

function formatAtlasMoney(value){
  const number=Number(value||0);

}

function formatAtlasPercent(value){
  const number=Number(value||0);
  const sign=number>0?'+':'';
  return `${sign}${new Intl.NumberFormat('pt-PT',{

}

function bindAssetCalculations(form){
  if(!form)return;

  const quantity=form.elements.quantity;
  const average=form.elements.average_price;
  const currentValue=form.elements.current_value;
  if(!quantity||!average||!currentValue)return;

  const update=()=>{
    const q=parseAtlasNumber(quantity.value);
    const avg=parseAtlasNumber(average.value);
    const current=parseAtlasNumber(currentValue.value);

    const invested=q*avg;
    const profit=current-invested;
    const returnPct=invested>0?(profit/invested)*100:0;

    const investedEl=form.querySelector('[data-calc="invested"]');
    const profitEl=form.querySelector('[data-calc="profit"]');
    const returnEl=form.querySelector('[data-calc="return"]');

    if(investedEl)investedEl.textContent=formatAtlasMoney(invested);
    if(profitEl){
      profitEl.textContent=(profit>0?'+':'')+formatAtlasMoney(profit);
      profitEl.className=`asset-calculation-value ${profit>0?'good':profit<0?'bad':''}`;
    }
    if(returnEl){
      returnEl.textContent=formatAtlasPercent(returnPct);
      returnEl.className=`asset-calculation-value ${returnPct>0?'good':returnPct<0?'bad':''}`;
    }
  };

  [quantity,average,currentValue].forEach(input=>{
    input.addEventListener('input',update);
    input.addEventListener('change',update);
  });

  update();
}

 const data=state.radarData||{};
 const components=[];
 const insiders=data?.sections?.insiders;
 const signal=insiders?.summary?.signal;
 if(insiders && insiders.status!=='disabled' && insiders.status!=='error'){
  const value=signal==='buying'?78:signal==='selling'?32:50;
  components.push({key:'insiders',label:'Insiders',value,weight:30,available:true});
 }else components.push({key:'insiders',label:'Insiders',value:null,weight:30,available:false});
 const level=data?.overview?.level;
 if(level){
  const value=level==='low'?72:level==='medium'?52:28;
  components.push({key:'macro',label:'Macro e notícias',value,weight:25,available:true});
 }else components.push({key:'macro',label:'Macro e notícias',value:null,weight:25,available:false});
 const next=futureEvents()[0];
 if(next){
  const days=Math.ceil((new Date(next.date+'T00:00:00')-new Date())/86400000);
  const value=next.impact==='high' && days<=7?42:next.impact==='medium' && days<=7?58:70;
  components.push({key:'calendar',label:'Calendário macro',value,weight:15,available:true});
 }else components.push({key:'calendar',label:'Calendário macro',value:null,weight:15,available:false});
 const optional=[
  ['buybacks','Buybacks',15],['funds','Grandes fundos',15]
 ];
 optional.forEach(([key,label,weight])=>{
  const section=data?.sections?.[key];
  if(section?.score!=null)components.push({key,label,value:Number(section.score),weight,available:true});
  else components.push({key,label,value:null,weight,available:false});
 });
 const available=components.filter(c=>c.available);
 const weight=available.reduce((s,c)=>s+c.weight,0);
 const score=weight?Math.round(available.reduce((s,c)=>s+c.value*c.weight,0)/weight):50;
 const label=score>=75?'Muito positivo':score>=60?'Positivo':score>=45?'Neutro':score>=30?'Cautela':'Pressão negativa';
 const tone=score>=60?'good':score>=45?'warn':'bad';
 return {score,label,tone,components,coverage:Math.round(weight/100*100)};
}
function money(v){return v==null?'—':new Intl.NumberFormat('pt-PT',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v)}
function formatDateTime(v){if(!v)return '—';try{return new Intl.DateTimeFormat('pt-PT',{dateStyle:'medium'}).format(new Date(v))}catch{return v}}
function moduleState(section){
 if(!section)return {label:'Sem cobertura gratuita',className:'muted'};
 if(section.status==='ok')return {label:'Com dados',className:'good'};
 if(section.status==='empty')return {label:'Sem ocorrências',className:'warn'};
 if(section.status==='disabled')return {label:'Não configurado',className:'warn'};
 return {label:'Indisponível',className:'bad'};
}

async function inspectPWA(){
 try{
  const manifestLink=document.querySelector('link[rel="manifest"]');
  if(manifestLink){
   const response=await fetch(manifestLink.href,{cache:'no-store'});
   pwaState.manifest=response.ok;
  }
 }catch(error){
  console.warn('Manifest:',error);
  pwaState.manifest=false;
 }

 try{
  if('serviceWorker' in navigator){
   const registration=await navigator.serviceWorker.getRegistration('/');
   pwaState.serviceWorker=Boolean(registration);
  }
 }catch(error){
  console.warn('Service Worker:',error);
  pwaState.serviceWorker=false;
 }

 pwaState.installed=window.matchMedia('(display-mode: standalone)').matches||Boolean(navigator.standalone);
 return pwaState;
}

function pwaMessage(){
 if(pwaState.installed)return 'O ATLAS já está instalado neste dispositivo.';
 if(!window.isSecureContext)return 'A instalação exige uma ligação HTTPS.';
 if(!pwaState.manifest)return 'O manifesto da aplicação não foi carregado. Atualiza a página e tenta novamente.';
 if(!pwaState.serviceWorker)return 'O serviço offline ainda não ficou ativo. Atualiza a página e tenta novamente.';
 return 'No Chrome, abre o menu ⋮ e escolhe “Instalar ATLAS”. No Safari do Mac, usa Ficheiro → Adicionar à Dock.';
}

}
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall=null}else toast('Publica em HTTPS e usa o menu do navegador para instalar.')}
async function logout(){await db.auth.signOut();location.reload()}

window.atlas={show:showPage,refreshPrices:refreshMarketData,refreshRadar,editAsset,remove:removeRow,sync:loadAll,install:installApp,notify:requestNotifications,logout,checkUpdates:()=>checkForUpdates(true),applyUpdate,removeTrackedSymbol};

$('auth-form').onsubmit=async e=>{e.preventDefault();$('auth-status').textContent='A entrar…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('auth-status').textContent=error.message;session=data.session;await openApp()};
$('signup').onclick=async()=>{const {error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('auth-status').textContent=error?error.message:'Conta criada. Confirma o email se for solicitado.'};
$('logout').onclick=logout;$('install').onclick=installApp;$('sync').onclick=loadAll;$('menu').onclick=()=>document.querySelector('.sidebar').classList.toggle('open');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;pwaState.installable=true;});
window.addEventListener('appinstalled',()=>{pwaState.installed=true;deferredInstall=null;toast('ATLAS instalado com sucesso.');});
if('serviceWorker' in navigator){
 window.addEventListener('load',async()=>{
  try{
   await navigator.serviceWorker.register('/service-worker.js',{scope:'/'});
   await navigator.serviceWorker.ready;
  }catch(error){
   console.error('Service Worker:',error);
  }
  await inspectPWA();
 });
}
bootstrap();
</script>
